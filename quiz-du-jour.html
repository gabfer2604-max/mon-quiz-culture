        // 2. Fonction pour trouver le numéro du jour de l'année (1 à 365)
        function getJourDeLAnnee() {
            const maintenant = new Date();
            const debutAnnee = new Date(maintenant.getFullYear(), 0, 0);
            const diff = maintenant - debutAnnee;
            const unJour = 1000 * 60 * 60 * 24;
            return Math.floor(diff / unJour);
        }

        // 3. Affichage de la date et de la question du jour
        function chargerQuiz() {
            const dateAujourdhui = new Date();
            const optionsDate = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateAujourdhui').textContent = dateAujourdhui.toLocaleDateString('fr-FR', optionsDate);

            const indexJour = getJourDeLAnnee() % quiz365.length;
            const quizActuel = quiz365[indexJour];

            document.getElementById('questionDuJour').textContent = quizActuel.q;
            document.getElementById('reponseDuJour').textContent = "Réponse : " + quizActuel.r;
        }

        function afficherReponse() {
    const reponseBox = document.getElementById('reponseDuJour');
    reponseBox.style.display = 'block';

    // AJOUT DU CODE POUR COMPTER LES POINTS
    let score = parseInt(localStorage.getItem('quiz_score_total') || 0) + 10;
    let nbQuiz = parseInt(localStorage.getItem('quiz_count') || 0) + 1;

    localStorage.setItem('quiz_score_total', score);
    localStorage.setItem('quiz_count', nbQuiz);

    chargerScoreMenu();
}

        // Charger au lancement
        chargerQuiz();

    const scoreSauvegarde = localStorage.getItem('quiz_score_total') || 0;

    const elemScore = document.getElementById('total-score');
    const elemCount = document.getElementById('quiz-count');

    if (elemScore) elemScore.textContent = scoreSauvegarde;
    if (elemCount) elemCount.textContent = quizCountSauvegarde;
}

window.addEventListener('DOMContentLoaded', chargerScoreMenu);
