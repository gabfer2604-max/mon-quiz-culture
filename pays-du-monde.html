<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz : Les Pays du Monde - CultureQuiz</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #f59e0b;
      --green: #22c55e;
      --red: #ef4444;
      --gray-map: #334155;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: var(--accent);
    }

    /* Tableau de bord */
    .dashboard {
      display: flex;
      gap: 25px;
      background: var(--card-bg);
      padding: 15px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-box {
      text-align: center;
    }

    .stat-val {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .input-zone {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      padding: 12px 16px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 2px solid #475569;
      background: #0f172a;
      color: white;
      outline: none;
      width: 260px;
      transition: border 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 12px 20px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-start { background: var(--green); color: white; }
    .btn-giveup { background: var(--red); color: white; }
    .btn:active { transform: scale(0.95); }

    /* Conteneur de la carte */
    .map-container {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      text-align: center;
    }

    svg path {
      fill: var(--gray-map);
      stroke: #0f172a;
      stroke-width: 0.6;
      transition: fill 0.3s ease;
      cursor: pointer;
    }

    svg path.found { fill: var(--green) !important; }
    svg path.missed { fill: var(--red) !important; }

    @keyframes pulse {
      0% { fill: #86efac; }
      100% { fill: var(--green); }
    }
    .flash { animation: pulse 0.5s ease-out; }
  </style>
</head>

  <div class="header">
    <h1>🌍 Quiz : Les Pays du Monde</h1>
    <p>Trouve le maximum de pays en 15 minutes. Tape le nom d'un pays pour le valider automatiquement !</p>
  </div>

  <div class="dashboard">

      <div class="stat-val" id="score">0 / 196</div>
      <div class="stat-label">Pays trouvés</div>
    </div>

    <div class="input-zone">
      <input type="text" id="countryInput" placeholder="Tape un pays..." disabled autocomplete="off">
      <button class="btn btn-start" id="startBtn" onclick="toggleGame()">Démarrer</button>
    </div>
  </div>

      <path id="it" d="M 500 152 L 510 155 L 515 175 L 505 170 Z" title="Italie"></path>
      <path id="us" d="M 150 150 L 250 150 L 240 200 L 140 180 Z" title="États-Unis"></path>
      <path id="gb" d="M 465 120 L 480 120 L 478 135 L 463 132 Z" title="Royaume-Uni"></path>
      <path id="id" d="M 750 280 L 800 280 L 790 300 L 740 300 Z" title="Indonésie"></path>

    <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 15px;">
      * Moteur de recherche ultra-flexible : les accents, majuscules, espaces et tirets sont ignorés automatiquement.
    </p>
  </div>

      return str
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Supprime tous les accents (é -> e, ô -> o, etc.)
        .replace(/[^a-z0-9]/g, ""); // Supprime les espaces, tirets et apostrophes

      { id: "zw", names: ["zimbabwe"] }
    ];

    let foundCount = 0;
    let timeLeft = 900; // 15 minutes en secondes
    let timerInterval = null;
    let isPlaying = false;

    const input = document.getElementById("countryInput");
    const timerDisplay = document.getElementById("timer");
    const scoreDisplay = document.getElementById("score");
    const startBtn = document.getElementById("startBtn");

    function toggleGame() {
      if (!isPlaying) {
        startGame();
      } else {
        endGame(false);
      }
    }

    function startGame() {
      isPlaying = true;
      foundCount = 0;
      timeLeft = 900;
      scoreDisplay.textContent = `0 / ${countries.length}`;
      
      // Réinitialiser la carte
      countries.forEach(c => {
        const el = document.getElementById(c.id);
        if (el) el.className.baseVal = "";
      });

      input.disabled = false;
      input.value = "";
      input.focus();

      startBtn.textContent = "Abandonner";
      startBtn.className = "btn btn-giveup";

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) endGame(true);
      }, 1000);
    }

    function updateTimerDisplay() {
      const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const sec = String(timeLeft % 60).padStart(2, '0');
      timerDisplay.textContent = `${min}:${sec}`;
    }

    // 3. Écouteur de saisie ultra-indulgent avec nettoyage automatique
    input.addEventListener("input", (e) => {
      if (!isPlaying) return;

      const saisieNettoyee = nettoyerTexte(e.target.value);
      if (!saisieNettoyee) return;

      countries.forEach(country => {
        const el = document.getElementById(country.id);
        if (!el || !el.classList.contains("found")) {
          // Compare la saisie nettoyée avec chaque nom possible du pays (également nettoyé)
          const match = country.names.some(nom => nettoyerTexte(nom) === saisieNettoyee);

          if (match) {
            if (el) el.classList.add("found", "flash");
            foundCount++;
            scoreDisplay.textContent = `${foundCount} / ${countries.length}`;
            input.value = ""; // Vide le champ instantanément dès que c'est bon

            if (foundCount === countries.length) endGame(true);
          }
        }
      });
    });

    function endGame(completed) {
      isPlaying = false;
      clearInterval(timerInterval);
      input.disabled = true;

      startBtn.textContent = "Recommencer";
      startBtn.className = "btn btn-start";

      // Révéler les pays non trouvés en rouge sur la carte
      countries.forEach(country => {
        const el = document.getElementById(country.id);
        if (el && !el.classList.contains("found")) {
          el.classList.add("missed");
        }
      });

      alert(completed && foundCount === countries.length 
        ? "🏆 Incroyable ! Tu as trouvé tous les pays du monde !" 
        : `Partie terminée ! Score : ${foundCount} / ${countries.length}`);
    }
