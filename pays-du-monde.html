<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz : Les Pays du Monde</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #f59e0b;
      --green: #22c55e;
      --red: #ef4444;
      --gray-map: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--accent);
    }

    .header p {
      margin: 5px 0 0;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-box {
      background: var(--card-bg);
      padding: 10px 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .stat-val {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .input-zone {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    #countryInput {
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid #475569;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      width: 250px;
    }

    #countryInput:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-start {
      background: var(--green);
      color: white;
    }

    .btn-start:hover {
      background: #16a34a;
    }

    .btn-giveup {
      background: var(--red);
      color: white;
    }

    .map-container {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .map-container svg {
      width: 100%;
      height: auto;
      max-height: 600px;
    }

    /* États par défaut de la carte */
    svg path, svg polygon, svg rect, svg g {
      transition: fill 0.3s ease;
    }

    .found {
      fill: var(--green) !important;
    }

    .missed {
      fill: var(--red) !important;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🌍 Quiz : Les Pays du Monde</h1>
    <p>Trouve le maximum de pays en 15 minutes. Tape le nom d'un pays pour le valider automatiquement !</p>
  </div>

  <div class="dashboard">
    <div class="stat-box">
      <div class="stat-val" id="timer">15:00</div>
      <div class="stat-label">Temps restant</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="score">0 / 196</div>
      <div class="stat-label">Pays trouvés</div>
    </div>
  </div>

  <div class="input-zone">
    <input type="text" id="countryInput" placeholder="Tape un pays..." disabled autocomplete="off">
    <button class="btn btn-start" id="startBtn" onclick="toggleGame()">Démarrer</button>
  </div>

    let foundCount = 0;
    let timeLeft = 900;
    let timerInterval = null;
    let isPlaying = false;

    const input = document.getElementById("countryInput");
    const timerDisplay = document.getElementById("timer");
    const scoreDisplay = document.getElementById("score");
    const startBtn = document.getElementById("startBtn");

    function toggleGame() {
      if (!isPlaying) {
        startGame();
      } else {
        endGame(false);
      }
    }

    function startGame() {
      isPlaying = true;
      foundCount = 0;
      timeLeft = 900;
      scoreDisplay.textContent = `0 / ${countries.length}`;
      
      countries.forEach(c => {
        const el = document.getElementById(c.id) || document.getElementById(c.id.toUpperCase()) || document.getElementById(c.id.toLowerCase());
        if (el) {
          el.style.fill = "";
          el.classList.remove("found", "missed");
          el.querySelectorAll('path, polygon, rect').forEach(p => {
            p.style.fill = "";
            p.classList.remove("found", "missed");
          });
        }
      });

      input.disabled = false;
      input.value = "";
      input.focus();

      startBtn.textContent = "Abandonner";
      startBtn.className = "btn btn-giveup";

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) endGame(true);
      }, 1000);
    }

    function updateTimerDisplay() {
      const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const sec = String(timeLeft % 60).padStart(2, '0');
      timerDisplay.textContent = `${min}:${sec}`;
    }

    input.addEventListener("input", (e) => {
      if (!isPlaying) return;

      const saisieNettoyee = nettoyerTexte(e.target.value);
      if (!saisieNettoyee) return;

      countries.forEach(country => {
        const el = document.getElementById(country.id) || document.getElementById(country.id.toUpperCase()) || document.getElementById(country.id.toLowerCase());
        
        if (el && !el.classList.contains("found")) {
          const match = country.names.some(nom => nettoyerTexte(nom) === saisieNettoyee);

          if (match) {
  el.style.setProperty('fill', '#22c55e', 'important');
  el.querySelectorAll('*').forEach(p => p.style.setProperty('fill', '#22c55e', 'important'));
  el.classList.add("found");

            foundCount++;
            scoreDisplay.textContent = `${foundCount} / ${countries.length}`;
            input.value = "";

            if (foundCount === countries.length) endGame(true);
          }
        }
      });
    });

    function endGame(completed) {
      isPlaying = false;
      clearInterval(timerInterval);
      input.disabled = true;

      startBtn.textContent = "Recommencer";
      startBtn.className = "btn btn-start";

      countries.forEach(country => {
        const el = document.getElementById(country.id) || document.getElementById(country.id.toUpperCase()) || document.getElementById(country.id.toLowerCase());
        if (el && !el.classList.contains("found")) {
  el.style.setProperty('fill', '#ef4444', 'important');
  el.querySelectorAll('*').forEach(p => p.style.setProperty('fill', '#ef4444', 'important'));
  el.classList.add("missed");
}
      });
    }
