<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Quiz Culture</title>
    <style>
        /* Animation ajustée à 15ms (0.015s) */
        * {
            box-sizing: border-box;
            transition: background-color 0.015s ease, color 0.015s ease, transform 0.015s ease, box-shadow 0.015s ease;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        body.theme-sombre {
            background-color: #121212;
            color: #ffffff;
        }

        body.theme-bleu {
            background-color: #1e293b;
            color: #ffffff;
        }

        /* Bouton Menu Burger */
        .burger-menu {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 8px;
            z-index: 1000;
            border-radius: 6px;
        }

        .burger-menu:active {
            transform: scale(0.92);
        }

        .burger-bar {
            width: 25px;
            height: 3px;
            background-color: #888888;
            border-radius: 2px;
        }

        /* Panneau latéral coulissant */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background-color: #444444;
            color: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1001;
            padding: 20px;
            overflow-y: auto;
            will-change: transform;
        }

        .sidebar.open {
            transform: translateX(280px);
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            float: right;
            cursor: pointer;
            padding: 5px;
        }

        /* Style des titres repliables */
details summary.menu-title {
    color: #ff9800;
    font-weight: bold;
    font-size: 1.1rem;
    cursor: pointer;
    list-style: none;
    margin-top: 15px;
    margin-bottom: 8px;
    border-bottom: 1px solid #444;
    padding-bottom: 6px;
    user-select: none;
}

details summary::-webkit-details-marker {
    display: none;
}

details summary.menu-title::after {
    content: " ▾";
    float: right;
    font-size: 1.7rem;
}

details[open] summary.menu-title::after {
    content: " ▴";
}

/* Style des sous-menus et liens */
.submenu, details ul {
    list-style: none;
    padding: 0;
    margin: 8px 0;
}

.submenu li, details ul li {
    margin: 10px 0;
}

.submenu a, details ul a {
    color: #dddddd;
    text-decoration: none;
    font-size: 0.95rem;
    display: block;
    padding: 4px 0;
}

.submenu a:hover, details ul a:hover {
    color: #ff9800;
}

        /* Voile sombre */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        h1#titre {
            font-size: 1.8rem;
            margin-top: 50px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 800px;
            line-height: 1.4;
        }

        /* Bouton principal */
        #monBouton {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            padding: 0;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff9800;
            color: white;
            border: none;
            cursor: pointer;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
            user-select: none;
        }

        #monBouton:active {
            transform: scale(0.92);
            box-shadow: 0 2px 6px rgba(255, 152, 0, 0.2);
        }

        #barreRecherche {
            padding: 12px 15px;
            font-size: 15px;
            width: 100%;
            max-width: 380px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 25px;
            outline: none;
        }

        #barreRecherche:focus {
            border-color: #ff9800;
        }

        #themeContainer {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-theme {
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #f5f5f5;
            cursor: pointer;
        }

        .btn-theme:active {
            transform: scale(0.95);
        }

        #selectCategorie {
            padding: 10px 14px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 40px;
            outline: none;
            background-color: white;
        }

        footer {
            margin-top: auto;
            padding-top: 20px;
        }

        footer a {
            color: #888;
            text-decoration: underline;
            font-size: 0.9em;

            /* Style du menu repliable */
.menu-group {
    margin-bottom: 15px;
}

summary.menu-title {
    color: #ffaa00;
    font-weight: bold;
    font-size: 1.1rem;
    cursor: pointer;
    list-style: none;
    user-select: none;
    margin-bottom: 8px;
}

summary.menu-title::-webkit-details-marker {
    display: none;
}

summary.menu-title::after {
    content: " ▾";
    font-size: 0.8rem;
}

details[open] summary.menu-title::after {
    content: " ▴";
}

.submenu {
    list-style: none;
    padding-left: 10px;
    margin: 0;
}

.submenu li {
    margin: 8px 0;
}

.submenu a {
    color: white;
    text-decoration: none;
}

            /* Forcer la couleur blanche sur les liens des sous-menus */
.submenu a,
details ul a {
    color: white !important;
    text-decoration: none;
}

/* Changement au survol de la souris */
.submenu a:hover,
details ul a:hover {
    color: #ffaa00; /* Devient orange au survol */
    text-decoration: underline;
}
    </style>
</head>
<body>

    <!-- Bouton 3 barres -->
    <button class="burger-menu" onclick="toggleMenu()" aria-label="Ouvrir le menu">
        <div class="burger-bar"></div>
        <div class="burger-bar"></div>
        <div class="burger-bar"></div>
    </button>

    <!-- Voile sombre -->
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <!-- Menu latéral -->
<div id="sidebar" class="sidebar">
    <button class="close-btn" onclick="toggleMenu()">&times;</button>
    <br><br>

    <!-- 1. Section Actu -->
    <details open class="menu-group">
        <summary class="menu-title">Actu</summary>
        <ul class="submenu">
            <li><a href="https://www.francetvinfo.fr/" target="_blank">Franceinfo</a></li>
            <li><a href="https://www.20minutes.fr/" target="_blank">20 Minutes</a></li>
            <li><a href="https://france3-regions.francetvinfo.fr/" target="_blank">France 3 Régions</a></li>
            <li><a href="https://www.lequipe.fr/" target="_blank">L'Équipe</a></li>
            <li><a href="https://www.lefigaro.fr/" target="_blank">Le Figaro</a></li>
            <li><a href="https://www.lemonde.fr/" target="_blank">Le Monde</a></li>
        </ul>
    </details>

    <!-- 2. Section Le lecteur -->
    <details open class="menu-group">
        <summary class="menu-title">Le lecteur</summary>
        <ul class="submenu">
            <li><a href="generateur-de-faits.html">La démarche du projet</a></li>
            <li>
                <a href="quiz-du-jour.html">🎯 Le Quiz du Jour</a>
                <!-- Petit affichage du score intégré au menu -->
                <div id="menu-score" style="font-size: 0.85rem; color: #ffaa00; margin-top: 4px; padding-left: 5px;">
                    ⭐ Score : <span id="total-score">0</span> pts (<span id="quiz-count">0</span> joué)
                </div>
            </li>
        </ul>
    </details>

    <!-- 3. Section À propos -->
    <details open class="menu-group">
        <summary class="menu-title">À propos</summary>
        <ul class="submenu">
            <li><a href="a-propos.html">Qui suis-je ?</a></li>
        </ul>
    </details>
</div>

    <!-- Contenu principal -->
    <h1 id="titre">Texte original</h1>

    <button id="monBouton">Cliquer ici</button>
    <button id="btnPartage" onclick="partagerFaitActuel()">📲 Partager</button>

    <input type="text" id="barreRecherche" placeholder="Rechercher une info...">
    <div id="resultatsRecherche" style="margin-bottom: 20px; text-align: center;"></div>

    <div id="themeContainer">
        <button class="btn-theme" onclick="changerTheme('clair')">Clair</button>
        <button class="btn-theme" onclick="changerTheme('sombre')">Sombre</button>
        <button class="btn-theme" onclick="changerTheme('bleu')">Bleu</button>
    </div>

    <div>
        <select id="selectCategorie">
            <option value="tous">Tous les thèmes</option>
            <option value="politique">Politique / Géopolitique</option>
            <option value="cinematographie">Cinéma</option>
            <option value="arts">Arts</option>
            <option value="musique">Musique</option>
            <option value="nature">Nature</option>
            <option value="geographie">Géographie</option>
            <option value="sport">Sport</option>
            <option value="gaming">Gaming</option>
        </select>
    </div>
    
    <footer>
        <a href="politique-confidentialite.html">Politique de confidentialité</a>
    </footer>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        const bouton = document.getElementById('monBouton');
        const titre = document.getElementById('titre');

        let dernierIndex = -1;

        const infos = [
            { texte: "Nauru est le seul pays du monde qui ne possède pas de capitale officielle.", cat: "geographie" },
            { texte: "Les bananes sont naturellement légèrement radioactives.", cat: "nature" },
            { texte: "Les seuls pays possédant des missiles nucléaires sont la Russie, les USA, la Chine, la France, le Royaume-Uni, l'Inde, le Pakistan, Israël et la Corée du Nord.", cat: "politique" },
            { texte: "Lionel Messi est officiellement le joueur le plus titré de l'histoire du football avec pas moins de 46 trophées cumulés.", cat: "sport" },
            { texte: "Depuis la sortie de la console, Sony a declared le 31 mars 2026 avoir vendu 93,7 millions d'exemplaires de PS5 à travers le monde.", cat: "gaming" },
            { texte: "L'intelligence artificielle Chat GPT s'impose comme étant l'application la plus téléchargée au monde en 2025 succédant à Instagram en 2024.", cat: "gaming" },
            { texte: "Le Brésil est la nation qui possède le plus de coupe du monde de football.", cat: "sport" },
            { texte: "Le Rafale génère à lui tout seul 30 à 40% des exportations de défense de la France.", cat: "politique" },
            { texte: "La matière la plus chère du monde est l'antimatière.", cat: "nature" },
            { texte: "L'homme connu le plus grand jamais mesuré est officiellement Robert Wadlow et mesurait 2,72 mètre.", cat: "nature" },
            { texte: "Le rapeur Ninho est en 2026 l'artiste francophone le plus titré au monde.", cat: "musique" },
            { texte: "Le Javascript est le langage informatique le plus utilisé au monde.", cat: "gaming" },
            { texte: "Les 5 plus grands PIB au monde actuel sont : 1-Les USA, 2-La Chine, 3-L'Allemagne, 4-Le Japon, 5-Le Royaume Uni.", cat: "politique" },
            { texte: "La Suède est le pays qui compte le plus d'îles au monde.", cat: "geographie" },
            { texte: "Les astronomes estiment qu'il y a plus d'étoiles présentes dans l'univers que de grains de sable sur Terre.", cat: "nature" },
            { texte: "Chez les hyènes tachetées, les femelles possèdent un pseudo pénis.", cat: "nature" },
            { texte: "À sa naissance, un girafon tombe de à peu près 1,5 à 2 mètres de haut.", cat: "nature" },
            { texte: "En 2023 à Los Angeles, la plus grande pizza au monde a été cuisinée.", cat: "arts" },
            { texte: "Les statues géantes situées sur l'île de Pâques se nomment moaï.", cat: "arts" },
            { texte: "Le Canada est le 2ème pays du monde mais il est également le pays avec le plus de littoral au monde.", cat: "geographie" },
            { texte: "Le serpent le plus venimeux au monde est le Taïpan du désert.", cat: "nature" },
            { texte: "Baby Shark est la vidéo la plus visionnée au monde.", cat: "cinematographie" },
            { texte: "Le mat le plus rapide aux échecs est le mat du sot.", cat: "gaming" },
            { texte: "La maison de production la plus riche du monde est actuellement Walt Disney Company.", cat: "cinematographie" },
            { texte: "Le jeu Minecraft sorti en 2011 est désormais reconnu comme étant le jeu vidéo le plus vendu de tous les temps.", cat: "gaming" },
            { texte: "La religion la plus pratiquée au monde est le christianisme.", cat: "politique" },
            { texte: "L'animal marin le plus rapide du monde est le voilier de l'Indo-Pacifique.", cat: "nature" },
            { texte: "La crevette-mante frappeuse est capable d'enchaîner des coups de poings atteignant une puissance de 1500 newtons.", cat: "nature" },
            { texte: "Le Nokia 1100 demeure comme le téléphone le plus vendu de tous les temps.", cat: "gaming" },
            { texte: "Le Turritopsis dohrnii est immunisé contre la mort naturelle et la vieillesse.", cat: "nature" },
            { texte: "Les corbeaux sont très intelligents, ils sont capables de reconnaître de visages.", cat: "nature" },
            { texte: "En Février 1917, les révolus bolcheviks Russes sous l'influence de Lénine renversent le régime Tsariste.", cat: "politique" },
            { texte: "Le Parti Socialiste Français a été fondé en 1905.", cat: "politique" },
            { texte: "L'USS Nautilus est le plus ancien sous marin armé du monde.", cat: "politique" },
            { texte: "D'après les historiens, la Seconde Guerre Mondiale aurait dans son entièreté causée la mort de 60 à 85 millions de personnes.", cat: "politique" },
            { texte: "L'URSS (dirigée par Joseph Staline) est considérée comme étant la première nation ayant résistée au Blitzkrieg Allemands.", cat: "politique" },
            { texte: "À Singapour, mâcher un chewing-gum est interdit.", cat: "politique" },
            { texte: "Au Canada, les lacs représentent environ 7,6% du territoire.", cat: "geographie" },
            { texte: "La Russie possède un frontière d'environ 18 km de long avec la corée du nord.", cat: "geographie" },
            { texte: "La Bolivie ne possède plus d'accès à l'océan ou la mer depuis 1884.", cat: "geographie" },
            { texte: "La Russie et les États-Unis sont séparés de seulement 3,8 km entre la grande Diomède et la petite Diomède.", cat: "geographie" },
            { texte: "Les Émirats arabes unis est une fédération formée par 7 émirats.", cat: "politique" },
            { texte: "En 2025, le PIB de la Corée du Sud atteignait environ $1,870,000,000,000.", cat: "politique" },
            { texte: "La piste d'atterrissage la plus dangerous au monde est celle de l'aéroport Tenzing-Hillary à Lukla, au Népal.", cat: "geographie" },
            { texte: "Mao Zedong (Chine, 1949) est considéré comme l'homme ayant causé le plus de mort.", cat: "politique" }
        ];

        bouton.addEventListener('click', function() {
            const selectCategorie = document.getElementById('selectCategorie');
            const catChoisie = selectCategorie ? selectCategorie.value : 'tous';

            const infosFiltrees = catChoisie === 'tous' 
                ? infos 
                : infos.filter(info => info.cat === catChoisie);

            if (infosFiltrees.length === 0) {
                titre.textContent = "Aucun fait disponible pour cette catégorie.";
                return;
            }

            let auHasard;
            do {
                auHasard = Math.floor(Math.random() * infosFiltrees.length);
            } while (auHasard === dernierIndex && infosFiltrees.length > 1);

            dernierIndex = auHasard;
            titre.textContent = infosFiltrees[auHasard].texte;
        });
        function partagerFaitActuel() {
    const texteFait = document.getElementById('titre').textContent;
    const urlSite = window.location.origin;

    const messagePartage = `💡 *Le saviez-vous ?*\n\n« ${texteFait} »\n\n👉 Découvre d'autres faits sur : ${urlSite}`;

    if (navigator.share) {
        navigator.share({
            title: 'Le saviez-vous ?',
            text: messagePartage,
            url: urlSite
        }).catch(() => {});
    } else {
        navigator.clipboard.writeText(messagePartage).then(() => {
            alert("📋 Fait copié dans le presse-papier !");
        });
    }
}

        const barreRecherche = document.getElementById('barreRecherche');
        const resultatsRecherche = document.getElementById('resultatsRecherche');

        barreRecherche.addEventListener('input', function() {
            const texteSaisi = barreRecherche.value.toLowerCase().trim();

            if (texteSaisi === '') {
                resultatsRecherche.innerHTML = '';
                return;
            }

            const resultats = infos.filter(info => info.texte.toLowerCase().includes(texteSaisi));

            if (resultats.length > 0) {
                resultatsRecherche.innerHTML = resultats.map(item => `<p>${item.texte}</p>`).join('');
            } else {
                resultatsRecherche.innerHTML = '<p>Aucun résultat trouvé.</p>';
            }
        });

        function changerTheme(theme) {
            document.body.classList.remove('theme-sombre', 'theme-bleu');

            if (theme === 'sombre') {
                document.body.classList.add('theme-sombre');
            } else if (theme === 'bleu') {
                document.body.classList.add('theme-bleu');
            }
        }
        function chargerScoreMenu() {
    const scoreSauvegarde = localStorage.getItem('quiz_score_total') || 0;
    const quizCountSauvegarde = localStorage.getItem('quiz_count') || 0;

    const elemScore = document.getElementById('total-score');
    const elemCount = document.getElementById('quiz-count');

    if (elemScore) elemScore.textContent = scoreSauvegarde;
    if (elemCount) elemCount.textContent = quizCountSauvegarde;
}

window.addEventListener('DOMContentLoaded', chargerScoreMenu);
    </script>
</body>
</html>
