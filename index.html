<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon projet</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #ffffff;
      }

      h1 {
        color: #000000;
        font-size: 2rem;
        margin-bottom: 20px;
        text-align: center;
      }

      button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 500;
        border: none;
        border-radius: 980px;
        background-color: #ff9317;
        color: rgb(255, 255, 255);
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      button:hover {
        background-color: #e37500;
      }

      button:active {
        transform: scale(0.96);
      }
    /* Définition des animations */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

@keyframes rotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes slidedown {
  0% { transform: translateY(-30px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

/* Classes à appliquer */
.anim-shake { animation: shake 0.4s ease; }
.anim-pop { animation: pop 0.3s ease; }
.anim-rotate { animation: rotate 0.5s ease; }
.anim-flip { animation: flip 0.6s ease; }
/* Style des petits boutons de thème */
.btn-theme {
    padding: 6px 12px;
    font-size: 14px;
    border-radius: 6px;
    background-color: #eee;
    color: #333;
    border: 1px solid #ccc;
    cursor: pointer;
}

/* Styles pour le mode Sombre */
body.theme-sombre {
    background-color: #1e1e1e !important;
    color: #ffffff !important;
}
body.theme-sombre h1 {
    color: #ffffff !important;
}

/* Styles pour le mode Bleu */
body.theme-bleu {
    background-color: #eef6ff !important;
    color: #0d3b66 !important;
}
body.theme-bleu h1 {
    color: #0d3b66 !important;
}
@media (max-width: 600px) {
  body {
    padding: 20px;
    height: auto; /* Permet au contenu de défiler proprement si l'écran est petit */
    min-height: 100vh;
  }

  h1 {
    font-size: 1.5rem;
  }

  button {
    width: 100%; /* Le bouton prend toute la largeur sur mobile */
    max-width: 300px;
  }
}
</style>
</head><body>

    <h1 id="titre">Texte original</h1>

// 2. Gestion du bouton d'affichage
bouton.addEventListener('click', function() {
    const selectCategorie = document.getElementById('selectCategorie');
    const catChoisie = selectCategorie ? selectCategorie.value : 'tous';

    const infosFiltrees = catChoisie === 'tous' 
        ? infos 
        : infos.filter(info => info.cat === catChoisie);

    if (infosFiltrees.length === 0) {
        titre.textContent = "Aucun fait disponible pour cette catégorie.";
        return;
    }

    let auHasard;
    do {
        auHasard = Math.floor(Math.random() * infosFiltrees.length);
    } while (auHasard === dernierIndex && infosFiltrees.length > 1);

    dernierIndex = auHasard;
    titre.textContent = infosFiltrees[auHasard].texte;

    // Animation
    titre.classList.remove(...animations);
    void titre.offsetWidth;
    const animAuHasard = animations[Math.floor(Math.random() * animations.length)];
    titre.classList.add(animAuHasard);
});

// 3. Barre de recherche
const barreRecherche = document.getElementById('barreRecherche');
const resultatsRecherche = document.getElementById('resultatsRecherche');

barreRecherche.addEventListener('input', function() {
    const texteSaisi = barreRecherche.value.toLowerCase().trim();

    if (texteSaisi === '') {
        resultatsRecherche.innerHTML = '';
        return;
    }

    const resultats = infos.filter(info => info.texte.toLowerCase().includes(texteSaisi));

    if (resultats.length > 0) {
        resultatsRecherche.innerHTML = resultats.map(item => `<p>${item.texte}</p>`).join('');
    } else {
        resultatsRecherche.innerHTML = '<p>Aucun résultat trouvé.</p>';
    }
});

// 4. Changement de thème
function changerTheme(theme) {
    document.body.classList.remove('theme-sombre', 'theme-bleu');

    if (theme === 'sombre') {
        document.body.classList.add('theme-sombre');
    } else if (theme === 'bleu') {
        document.body.classList.add('theme-bleu');
    }
}
