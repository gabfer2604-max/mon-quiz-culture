<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Quiz Culture</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .theme-sombre {
            background-color: #121212 !important;
            color: #ffffff !important;
        }

        .theme-bleu {
            background-color: #1e293b !important;
            color: #ffffff !important;
        }

        h1#titre {
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-align: center;
            max-width: 800px;
        }

        /* Bouton orange rond */
        #monBouton {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            padding: 0;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff9800;
            color: white;
            border: none;
            cursor: pointer;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s ease;
        }

        #monBouton:active {
            transform: scale(0.95);
        }

        /* Barre de recherche */
        #barreRecherche {
            padding: 10px 15px;
            font-size: 15px;
            width: 100%;
            max-width: 380px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        /* Selecteur de thème (boutons) */
        #themeContainer {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-theme {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #f5f5f5;
            cursor: pointer;
        }

        /* Selecteur de catégorie */
        #selectCategorie {
            padding: 8px 12px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 40px;
        }

        footer {
            margin-top: auto;
            padding-top: 20px;
        }

        footer a {
            color: #666;
            text-decoration: underline;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <h1 id="titre">Texte original</h1>

    <!-- 1. Bouton rond en haut -->
    <button id="monBouton">Cliquer ici</button>

    <!-- 2. Barre de recherche juste en dessous -->
    <input type="text" id="barreRecherche" placeholder="Rechercher une info...">
    <div id="resultatsRecherche" style="margin-bottom: 20px; text-align: center;"></div>

    <!-- 3. Thèmes -->
    <div id="themeContainer">
        <button class="btn-theme" onclick="changerTheme('clair')">Clair</button>
        <button class="btn-theme" onclick="changerTheme('sombre')">Sombre</button>
        <button class="btn-theme" onclick="changerTheme('bleu')">Bleu</button>
    </div>

    <!-- 4. Catégories -->
    <div>
        <select id="selectCategorie">
            <option value="tous">Tous les thèmes</option>
            <option value="politique">Politique / Géopolitique</option>
            <option value="cinematographie">Cinéma</option>
            <option value="arts">Arts</option>
            <option value="musique">Musique</option>
            <option value="nature">Nature</option>
            <option value="geographie">Géographie</option>
            <option value="sport">Sport</option>
            <option value="gaming">Gaming</option>
        </select>
    </div>

    <!-- 5. Politique de confidentialité en bas -->
    <footer>
        <a href="politique-confidentialite.html">Politique de confidentialité</a>
    </footer>

    <script>
        const bouton = document.getElementById('monBouton');
        const titre = document.getElementById('titre');

        let dernierIndex = -1;

        const infos = [
            { texte: "Nauru est le seul pays du monde qui ne possède pas de capitale officielle.", cat: "geographie" },
            { texte: "Les bananes sont naturellement légèrement radioactives.", cat: "nature" },
            { texte: "Les seuls pays possédant des missiles nucléaires sont la Russie, les USA, la Chine, la France, le Royaume-Uni, l'Inde, le Pakistan, Israël et la Corée du Nord.", cat: "politique" },
            { texte: "Lionel Messi est officiellement le joueur le plus titré de l'histoire du football avec pas moins de 46 trophées cumulés.", cat: "sport" },
            { texte: "Depuis la sortie de la console, Sony a déclaré le 31 mars 2026 avoir vendu 93,7 millions d'exemplaires de PS5 à travers le monde.", cat: "gaming" },
            { texte: "L'intelligence artificielle Chat GPT s'impose comme étant l'application la plus téléchargée au monde en 2025 succédant à Instagram en 2024.", cat: "gaming" },
            { texte: "Le Brésil est la nation qui possède le plus de coupe du monde de football.", cat: "sport" },
            { texte: "Le Rafale génère à lui tout seul 30 à 40% des exportations de défense de la France.", cat: "politique" },
            { texte: "La matière la plus chère du monde est l'antimatière.", cat: "nature" },
            { texte: "L'homme connu le plus grand jamais mesuré est officiellement Robert Wadlow et mesurait 2,72 mètre.", cat: "nature" },
            { texte: "Le rapeur Ninho est en 2026 l'artiste francophone le plus titré au monde.", cat: "musique" },
            { texte: "Le Javascript est le langage informatique le plus utilisé au monde.", cat: "gaming" },
            { texte: "Les 5 plus grands PIB au monde actuel sont : 1-Les USA, 2-La Chine, 3-L'Allemagne, 4-Le Japon, 5-Le Royaume Uni.", cat: "politique" },
            { texte: "La Suède est le pays qui compte le plus d'îles au monde.", cat: "geographie" },
            { texte: "Les astronomes estiment qu'il y a plus d'étoiles présentes dans l'univers que de grains de sable sur Terre.", cat: "nature" },
            { texte: "Chez les hyènes tachetées, les femelles possèdent un pseudo pénis.", cat: "nature" },
            { texte: "À sa naissance, un girafon tombe de à peu près 1,5 à 2 mètres de haut.", cat: "nature" },
            { texte: "En 2023 à Los Angeles, la plus grande pizza au monde a été cuisinée.", cat: "arts" },
            { texte: "Les statues géantes situées sur l'île de Pâques se nomment moaï.", cat: "arts" },
            { texte: "Le Canada est le 2ème pays du monde mais il est également le pays avec le plus de littoral au monde.", cat: "geographie" },
            { texte: "Le serpent le plus venimeux au monde est le Taïpan du désert.", cat: "nature" },
            { texte: "Baby Shark est la vidéo la plus visionnée au monde.", cat: "cinematographie" },
            { texte: "Le mat le plus rapide aux échecs est le mat du sot.", cat: "gaming" },
            { texte: "La maison de production la plus riche du monde est actuellement Walt Disney Company.", cat: "cinematographie" },
            { texte: "Le jeu Minecraft sorti en 2011 est désormais reconnu comme étant le jeu vidéo le plus vendu de tous les temps.", cat: "gaming" },
            { texte: "La religion la plus pratiquée au monde est le christianisme.", cat: "politique" },
            { texte: "L'animal marin le plus rapide du monde est le voilier de l'Indo-Pacifique.", cat: "nature" },
            { texte: "La crevette-mante frappeuse est capable d'enchaîner des coups de poings atteignant une puissance de 1500 newtons.", cat: "nature" },
            { texte: "Le Nokia 1100 demeure comme le téléphone le plus vendu de tous les temps.", cat: "gaming" },
            { texte: "Le Turritopsis dohrnii est immunisé contre la mort naturelle et la vieillesse.", cat: "nature" },
            { texte: "Les corbeaux sont très intelligents, ils sont capables de reconnaître de visages.", cat: "nature" },
            { texte: "En Février 1917, les révolus bolcheviks Russes sous l'influence de Lénine renversent le régime Tsariste.", cat: "politique" },
            { texte: "Le Parti Socialiste Français a été fondé en 1905.", cat: "politique" },
            { texte: "L'USS Nautilus est le plus ancien sous marin armé du monde.", cat: "politique" },
            { texte: "D'après les historiens, la Seconde Guerre Mondiale aurait dans son entièreté causée la mort de 60 à 85 millions de personnes.", cat: "politique" },
            { texte: "L'URSS (dirigée par Joseph Staline) est considérée comme étant la première nation ayant résistée au Blitzkrieg Allemands.", cat: "politique" },
            { texte: "À Singapour, mâcher un chewing-gum est interdit.", cat: "politique" },
            { texte: "Au Canada, les lacs représentent environ 7,6% du territoire.", cat: "geographie" },
            { texte: "La Russie possède un frontière d'environ 18 km de long avec la corée du nord.", cat: "geographie" },
            { texte: "La Bolivie ne possède plus d'accès à l'océan ou la mer depuis 1884.", cat: "geographie" },
            { texte: "La Russie et les États-Unis sont séparés de seulement 3,8 km entre la grande Diomède et la petite Diomède.", cat: "geographie" },
            { texte: "Les Émirats arabes unis est une fédération formée par 7 émirats.", cat: "politique" },
            { texte: "En 2025, le PIB de la Corée du Sud atteignait environ $1,870,000,000,000.", cat: "politique" },
            { texte: "La piste d'atterrissage la plus dangereuse au monde est celle de l'aéroport Tenzing-Hillary à Lukla, au Népal.", cat: "geographie" },
            { texte: "Mao Zedong (Chine, 1949) est considéré comme l'homme ayant causé le plus de mort.", cat: "politique" }
        ];

        bouton.addEventListener('click', function() {
            const selectCategorie = document.getElementById('selectCategorie');
            const catChoisie = selectCategorie ? selectCategorie.value : 'tous';

            const infosFiltrees = catChoisie === 'tous' 
                ? infos 
                : infos.filter(info => info.cat === catChoisie);

            if (infosFiltrees.length === 0) {
                titre.textContent = "Aucun fait disponible pour cette catégorie.";
                return;
            }

            let auHasard;
            do {
                auHasard = Math.floor(Math.random() * infosFiltrees.length);
            } while (auHasard === dernierIndex && infosFiltrees.length > 1);

            dernierIndex = auHasard;
            titre.textContent = infosFiltrees[auHasard].texte;
        });

        const barreRecherche = document.getElementById('barreRecherche');
        const resultatsRecherche = document.getElementById('resultatsRecherche');

        barreRecherche.addEventListener('input', function() {
            const texteSaisi = barreRecherche.value.toLowerCase().trim();

            if (texteSaisi === '') {
                resultatsRecherche.innerHTML = '';
                return;
            }

            const resultats = infos.filter(info => info.texte.toLowerCase().includes(texteSaisi));

            if (resultats.length > 0) {
                resultatsRecherche.innerHTML = resultats.map(item => `<p>${item.texte}</p>`).join('');
            } else {
                resultatsRecherche.innerHTML = '<p>Aucun résultat trouvé.</p>';
            }
        });

        function changerTheme(theme) {
            document.body.classList.remove('theme-sombre', 'theme-bleu');

            if (theme === 'sombre') {
                document.body.classList.add('theme-sombre');
            } else if (theme === 'bleu') {
                document.body.classList.add('theme-bleu');
            }
        }
    </script>
</body>
</html>
