<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres - CultureFaits</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* --- Styles des Thèmes --- */
    body.theme-blanc {
      background-color: #ffffff;
      color: #000000;
    }
    body.theme-blanc .card, body.theme-blanc .profile-card {
      background: #ffffff;
      border-color: #eaeaea;
    }

    body.theme-sombre {
      background-color: #121212;
      color: #f1f1f1;
    }
    body.theme-sombre .card {
      background: #1e1e1e;
      border: 1px solid #333;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    body.theme-sombre .profile-card {
      background-color: #2a2a2a;
      border: 1px solid #3d3d3d;
    }
    body.theme-sombre h2, body.theme-sombre .user-name {
      color: #ff9500;
    }
    body.theme-sombre .status-text {
      color: #aaaaaa;
    }

    body.theme-bleu {
      background-color: #e3f2fd;
      color: #0d47a1;
    }
    body.theme-bleu .card {
      background: #ffffff;
      border: 1px solid #bbdefb;
    }
    body.theme-bleu .profile-card {
      background-color: #f1f8fe;
      border: 1px solid #c8e6c9;
    }

    .card {
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 26px;
      font-weight: 700;
    }

    .profile-card {
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 65px;
      height: 65px;
      background-color: #ff9500;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(255, 149, 0, 0.3);
    }

    .status-text {
      font-size: 14px;
      margin: 0;
    }

    .user-name {
      font-size: 20px;
      font-weight: 700;
      color: #ff9500;
      margin: 0;
      word-break: break-word;
    }

    .user-email {
      font-size: 13px;
      color: #888888;
      margin: 0;
    }

    .btn-danger {
      width: 100%;
      padding: 12px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-danger:active {
      transform: scale(0.99);
    }

    .nav-link {
      margin-top: 25px;
      display: inline-block;
      color: #666666;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-link:hover {
      color: #ff9500;
      text-decoration: underline;
    }

    .parametres-theme {
      margin-top: 20px;
      text-align: center;
    }

    .parametres-theme button {
      padding: 8px 12px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Paramètres</h2>
    
    <!-- Carte de Profil -->
    <div class="profile-card">
      <div class="avatar" id="user-avatar">👤</div>
      <p class="status-text">Connecté en tant que :</p>
      <h3 class="user-name" id="user-pseudo">Chargement...</h3>
      <p class="user-email" id="user-email"></p>
    </div>

    <!-- Bouton de déconnexion -->
    <button id="btn-logout" class="btn-danger">Déconnexion</button>

    <br>
    <a href="index.html" class="nav-link">← Retour à l'accueil</a>

    <div class="parametres-theme">
      <h3>Choisir le thème</h3>
      <button onclick="changerTheme('blanc')">Blanc ☀️</button>
      <button onclick="changerTheme('sombre')">Sombre 🌙</button>
      <button onclick="changerTheme('bleu')">Bleu 🌊</button>
    </div>
  </div>

  <!-- Script Firebase avec version stable 10.8.0 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOsryqntdtf2PptednKPDE6BB03jIXH40",
      authDomain: "culturefaits.firebaseapp.com",
      projectId: "culturefaits",
      storageBucket: "culturefaits.firebasestorage.app",
      messagingSenderId: "192511796848",
      appId: "1:192511796848:web:cccef0c7ae77e823d6b6b5",
      measurementId: "G-PNWRYPXC4L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userPseudoEl = document.getElementById('user-pseudo');
    const userEmailEl = document.getElementById('user-email');
    const userAvatarEl = document.getElementById('user-avatar');
    const btnLogout = document.getElementById('btn-logout');

    // 1. Définition globale de la fonction changerTheme pour qu'elle soit accessible par les boutons HTML (onclick)
    window.changerTheme = function(theme) {
      document.body.className = ''; 
      if (theme === 'sombre') {
          document.body.classList.add('theme-sombre');
      } else if (theme === 'bleu') {
          document.body.classList.add('theme-bleu');
      } else {
          document.body.classList.add('theme-blanc');
      }

      localStorage.setItem('site_theme', theme);

      if (auth.currentUser) {
          const userDocRef = doc(db, "users", auth.currentUser.uid);
          updateDoc(userDocRef, { themeprefere: theme }).catch((error) => {
              console.log("Erreur de sauvegarde Firestore du thème :", error);
          });
      }
    };

    // 2. Charger le thème immédiatement au chargement du script
    const themeSauvegarde = localStorage.getItem('site_theme') || 'blanc';
    window.changerTheme(themeSauvegarde);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        let pseudo = user.email ? user.email.split('@')[0] : "Joueur";
        
        if (userEmailEl) userEmailEl.textContent = user.email || "";

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          
          if (userDoc.exists() && userDoc.data().pseudo) {
            pseudo = userDoc.data().pseudo;
          } else if (user.displayName) {
            pseudo = user.displayName;
          }

          // Si un thème est enregistré dans Firestore, on l'applique en priorité
          if (userDoc.exists() && userDoc.data().themeprefere) {
            window.changerTheme(userDoc.data().themeprefere);
          }
        } catch (e) {
          console.error("Erreur Firestore :", e);
        }

        if (userPseudoEl) userPseudoEl.textContent = pseudo;
        
        if (userAvatarEl && pseudo) {
          userAvatarEl.textContent = pseudo.charAt(0).toUpperCase();
        }

      } else {
        window.location.href = 'compte.html';
      }
    });

    if (btnLogout) {
      btnLogout.addEventListener('click', () => {
        signOut(auth).then(() => {
          window.location.href = 'index.html';
        });
      });
    }
  </script>
</body>
</html>
