<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres - CultureFaits</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #eaeaea;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #000000;
      font-size: 26px;
      font-weight: 700;
    }

    /* Styles de la Carte de Profil */
    .profile-card {
      background-color: #f9f9f9;
      border: 1px solid #eeeeee;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 65px;
      height: 65px;
      background-color: #ff9500;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(255, 149, 0, 0.3);
    }

    .status-text {
      font-size: 14px;
      color: #666666;
      margin: 0;
    }

    .user-name {
      font-size: 20px;
      font-weight: 700;
      color: #ff9500;
      margin: 0;
      word-break: break-word;
    }

    .user-email {
      font-size: 13px;
      color: #888888;
      margin: 0;
    }

    /* Boutons et navigation */
    .btn-danger {
      width: 100%;
      padding: 12px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-danger:active {
      transform: scale(0.99);
    }

    .nav-link {
      margin-top: 25px;
      display: inline-block;
      color: #666666;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-link:hover {
      color: #ff9500;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Paramètres</h2>
    
    <!-- Carte de Profil -->
    <div class="profile-card">
      <div class="avatar" id="user-avatar">👤</div>
      <p class="status-text">Connecté en tant que :</p>
      <h3 class="user-name" id="user-pseudo">Chargement...</h3>
      <p class="user-email" id="user-email"></p>
    </div>

    <!-- Bouton de déconnexion -->
    <button id="btn-logout" class="btn-danger">Déconnexion</button>

    <br>
    <a href="index.html" class="nav-link">← Retour à l'accueil</a>
  </div>

  <!-- Script Firebase pour récupérer le pseudo et gérer la déconnexion -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOsryqntdtf2PptednKPDE6BB03jIXH40",
      authDomain: "culturefaits.firebaseapp.com",
      projectId: "culturefaits",
      storageBucket: "culturefaits.firebasestorage.app",
      messagingSenderId: "192511796848",
      appId: "1:192511796848:web:cccef0c7ae77e823d6b6b5",
      measurementId: "G-PNWRYPXC4L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userPseudoEl = document.getElementById('user-pseudo');
    const userEmailEl = document.getElementById('user-email');
    const userAvatarEl = document.getElementById('user-avatar');
    const btnLogout = document.getElementById('btn-logout');

    // Récupération dynamique des données utilisateur
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (userEmailEl) userEmailEl.textContent = user.email;

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          let pseudo = "Joueur";
          
          if (userDoc.exists() && userDoc.data().pseudo) {
            pseudo = userDoc.data().pseudo;
          } else {
            pseudo = user.email.split('@')[0]; // Utilise le début de l'email si pas de pseudo
          }

          if (userPseudoEl) userPseudoEl.textContent = pseudo;
          
          // Met la première lettre du pseudo dans l'avatar
          if (userAvatarEl && pseudo) {
            userAvatarEl.textContent = pseudo.charAt(0).toUpperCase();
          }
        } catch (e) {
          if (userPseudoEl) userPseudoEl.textContent = user.email;
        }
      } else {
        // Redirection vers la page compte/connexion si déconnecté
        window.location.href = 'compte.html';
      }
    });

    // Action du bouton Déconnexion
    if (btnLogout) {
      btnLogout.addEventListener('click', () => {
        signOut(auth).then(() => {
          window.location.href = 'index.html';
        });
      });
    }
  </script>
</body>
</html>
