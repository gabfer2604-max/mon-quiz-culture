<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres - CultureFaits</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #eaeaea;
      max-width: 400px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #000000;
      font-size: 26px;
      font-weight: 700;
    }

    /* Styles de la Carte de Profil */
    .profile-card {
      background-color: #f9f9f9;
      border: 1px solid #eeeeee;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 65px;
      height: 65px;
      background-color: #ff9500;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(255, 149, 0, 0.3);
    }

    .status-text {
      font-size: 14px;
      color: #666666;
      margin: 0;
    }

    .user-name {
      font-size: 20px;
      font-weight: 700;
      color: #ff9500;
      margin: 0;
      word-break: break-word;
    }

    .user-email {
      font-size: 13px;
      color: #888888;
      margin: 0;
    }

    /* Boutons et navigation */
    .btn-danger {
      width: 100%;
      padding: 12px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-danger:active {
      transform: scale(0.99);
    }

    .nav-link {
      margin-top: 25px;
      display: inline-block;
      color: #666666;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-link:hover {
      color: #ff9500;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Paramètres</h2>
    
    <!-- Carte de Profil -->
    <div class="profile-card">
      <div class="avatar" id="user-avatar">👤</div>
      <p class="status-text">Connecté en tant que :</p>
      <h3 class="user-name" id="user-pseudo">Chargement...</h3>
      <p class="user-email" id="user-email"></p>
    </div>

    <!-- Bouton de déconnexion -->
    <button id="btn-logout" class="btn-danger">Déconnexion</button>

    <br>
    <a href="index.html" class="nav-link">← Retour à l'accueil</a>
  </div>

  <div class="parametres-theme">
    <h3>Choisir le thème</h3>
    <button onclick="changerTheme('blanc')">Blanc ☀️</button>
    <button onclick="changerTheme('sombre')">Sombre 🌙</button>
    <button onclick="changerTheme('bleu')">Bleu 🌊</button>
</div>

  <!-- Script Firebase avec version stable 10.8.0 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOsryqntdtf2PptednKPDE6BB03jIXH40",
      authDomain: "culturefaits.firebaseapp.com",
      projectId: "culturefaits",
      storageBucket: "culturefaits.firebasestorage.app",
      messagingSenderId: "192511796848",
      appId: "1:192511796848:web:cccef0c7ae77e823d6b6b5",
      measurementId: "G-PNWRYPXC4L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userPseudoEl = document.getElementById('user-pseudo');
    const userEmailEl = document.getElementById('user-email');
    const userAvatarEl = document.getElementById('user-avatar');
    const btnLogout = document.getElementById('btn-logout');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Affichage de secours immédiat (évite de rester bloqué sur "Chargement...")
        let pseudo = user.email ? user.email.split('@')[0] : "Joueur";
        
        if (userEmailEl) userEmailEl.textContent = user.email || "";

        try {
          // Chercher le vrai pseudo dans Firestore
          const userDoc = await getDoc(doc(db, "users", user.uid));
          
          if (userDoc.exists() && userDoc.data().pseudo) {
            pseudo = userDoc.data().pseudo;
          } else if (user.displayName) {
            pseudo = user.displayName;
          }
        } catch (e) {
          console.error("Erreur Firestore (utilisation du pseudo par défaut) :", e);
        }

        // Affichage final du pseudo
        if (userPseudoEl) userPseudoEl.textContent = pseudo;
        
        // Première lettre dans l'avatar
        if (userAvatarEl && pseudo) {
          userAvatarEl.textContent = pseudo.charAt(0).toUpperCase();
        }

      } else {
        window.location.href = 'compte.html';
      }
    });

    // Gestion de la déconnexion
    if (btnLogout) {
      btnLogout.addEventListener('click', () => {
        signOut(auth).then(() => {
          window.location.href = 'index.html';
        });
      });
    }
    // Fonction pour changer le thème
function changerTheme(theme) {
    // 1. Appliquer le thème immédiatement sur la page active
    document.body.className = ''; // Supprime les anciennes classes
    if (theme === 'sombre') {
        document.body.classList.add('theme-sombre');
    } else if (theme === 'bleu') {
        document.body.classList.add('theme-bleu');
    } else {
        document.body.classList.add('theme-blanc'); // Thème par défaut
    }

    // 2. Sauvegarder localement pour que ce soit instantané partout
    localStorage.setItem('site_theme', theme);

    // 3. Optionnel : Si l'utilisateur est connecté, sauvegarder aussi dans Firestore
    if (typeof auth !== 'undefined' && auth.currentUser) {
        const userDocRef = doc(db, "users", auth.currentUser.uid);
        updateDoc(userDocRef, { themeprefere: theme }).catch((error) => {
            console.log("Erreur de sauvegarde Firestore du thème :", error);
        });
    }
}

// 4. Charger le thème automatiquement dès qu'une page du site s'ouvre
window.addEventListener('DOMContentLoaded', () => {
    const themeSauvegarde = localStorage.getItem('site_theme') || 'blanc';
    changerTheme(themeSauvegarde);
});
  </script>
</body>
</html>
