<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Drapeaux - CultureFaits</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin: 0;
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
            overflow: hidden; /* Empêche tout défilement de la page */
        }

        .jeu-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: transparent;
            padding: 15px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        #drapeau-a-afficher {
            font-size: 90px;
            margin: 10px 0;
            line-height: 1;
            /* Empêche la sélection ou le mouvement bizarre de l'emoji */
            user-select: none;
            -webkit-user-select: none;
        }

        input[type="text"] {
            padding: 12px 15px;
            font-size: 16px;
            width: 80%;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ff9800;
        }

        button, .btn-accueil {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
            margin: 6px;
            text-decoration: none;
            display: inline-block;
            font-family: system-ui, -apple-system, sans-serif;
            width: 85%;
            max-width: 300px;
        }

        button:active, .btn-accueil:active {
            transform: scale(0.95);
        }

        #btn-suivant {
            background-color: #25D366;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            display: none; 
            width: auto;
        }

        #btn-valider {
            width: auto;
        }

        .btn-niveau {
            background-color: #007bff;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }

        /* Bouton spécifique pour le mode "Tous" */
        .btn-tous {
            background-color: #9c27b0;
            box-shadow: 0 4px 10px rgba(156, 39, 176, 0.3);
        }

        #message-feedback {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            min-height: 24px;
        }

        .score-box {
            margin-top: 10px;
            font-size: 16px;
            color: #555;
        }

        .menu-niveaux {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .zone-jeu-cachee {
            display: none;
        }
    </style>
</head>
<body>

            <h1 style="margin-top: 0; margin-bottom: 10px;">🚩 Teste tes drapeaux</h1>
            <p style="margin-top: 0; margin-bottom: 15px;">Choisis ton mode de jeu :</p>
            <button class="btn-niveau" onclick="lancerJeu('debutant')">1. Débutant 🧐</button>
            <button class="btn-niveau" onclick="lancerJeu('intermediaire')">2. Intermédiaire 👌</button>
            <button class="btn-niveau" onclick="lancerJeu('avance')">3. Avancé 🔥</button>
            <button class="btn-niveau" onclick="lancerJeu('goat')">4. GOAT 🐐</button>
            <button class="btn-tous" onclick="lancerJeu('tous')">5. Tous ❓ (Libre)</button>
            <br>
            <a href="index.html" class="btn-accueil" style="background-color: #ff9800; box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3); width: 85%; max-width: 300px;">⬅ Retour à l'accueil</a>
        </div>

        <!-- ÉCRAN DU JEU -->
        <div id="ecran-jeu" class="zone-jeu-cachee">

            <div id="drapeau-a-afficher">🇫🇷</div>

            <div id="zone-form">
                <input type="text" id="reponse-utilisateur" placeholder="Nom du pays..." autocomplete="off">
                <br>
                <button id="btn-valider" onclick="verifierReponse()">Valider</button>
                <button id="btn-suivant" onclick="chargerQuestion()">Question suivante ➡️</button>
            </div>

            <div id="message-feedback"></div>

            <div class="score-box">
                Score : <span id="score-actuel">0</span> points
            </div>

            <div style="margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px;">

            </div>
        </div>

        // Regroupement automatique pour le mode "Tous"
        baseDrapeaux.tous = [
            ...baseDrapeaux.debutant,
            ...baseDrapeaux.intermediaire,
            ...baseDrapeaux.avance,
            ...baseDrapeaux.goat
        ];

        let listeDrapeauxActuelle = [];
        let piocheActuelle = [];
        let drapeauActuel = null;
        let score = 0;

        function normaliserTexte(texte) {
            return texte
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]/g, "");
        }

        function melangerTableau(tableau) {
            let tableauMelange = [...tableau];
            for (let i = tableauMelange.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [tableauMelange[i], tableauMelange[j]] = [tableauMelange[j], tableauMelange[i]];
            }
            return tableauMelange;
        }

        function lancerJeu(niveau) {
            listeDrapeauxActuelle = baseDrapeaux[niveau];
            piocheActuelle = [];
            score = 0;
            document.getElementById("score-actuel").textContent = score;

            const titres = {
                debutant: "Niveau 1 : Débutant 🧐",
                intermediaire: "Niveau 2 : Intermédiaire 👌",
                avance: "Niveau 3 : Avancé 🔥",
                goat: "Niveau 4 : GOAT 🐐",
                tous: "Mode Libre : Tous ❓"
            };
            document.getElementById("titre-niveau").textContent = titres[niveau];

            document.getElementById("ecran-menu").style.display = "none";
            document.getElementById("ecran-jeu").style.display = "block";

            chargerQuestion();
        }

        function retourMenu() {
            document.getElementById("ecran-jeu").style.display = "none";
            document.getElementById("ecran-menu").style.display = "flex";
        }

        function chargerQuestion() {
            if (piocheActuelle.length === 0) {
                piocheActuelle = melangerTableau(listeDrapeauxActuelle);
            }
            drapeauActuel = piocheActuelle.pop();
            
            document.getElementById("drapeau-a-afficher").textContent = drapeauActuel.drapeau;
            document.getElementById("reponse-utilisateur").value = "";
            document.getElementById("message-feedback").textContent = "";

            document.getElementById("btn-valider").style.display = "inline-block";
            document.getElementById("btn-suivant").style.display = "none";
            document.getElementById("reponse-utilisateur").disabled = false;
            document.getElementById("reponse-utilisateur").focus();
        }

        function verifierReponse() {
            const saisieBrute = document.getElementById("reponse-utilisateur").value.trim();
            const feedback = document.getElementById("message-feedback");

            if (saisieBrute === "") return;

            const saisieNormalisee = normaliserTexte(saisieBrute);
            const bonneReponseNormalisee = normaliserTexte(drapeauActuel.nom);

            if (saisieNormalisee === bonneReponseNormalisee) {
                score++;
                document.getElementById("score-actuel").textContent = score;
                feedback.style.color = "green";
                feedback.textContent = "✅ Correct ! Bien joué.";
            } else {
                feedback.style.color = "red";
                feedback.textContent = `❌ Raté ! C'était : ${drapeauActuel.nom}`;
            }

            document.getElementById("btn-valider").style.display = "none";
            document.getElementById("btn-suivant").style.display = "inline-block";
            document.getElementById("reponse-utilisateur").disabled = true;
            document.getElementById("btn-suivant").focus();
        }

        document.getElementById("reponse-utilisateur").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verifierReponse();
            }
        });

</html>
