        let piocheActuelle = [];

        function melangerTableau(tableau) {
            let tableauMelange = [...tableau];
            for (let i = tableauMelange.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [tableauMelange[i], tableauMelange[j]] = [tableauMelange[j], tableauMelange[i]];
            }
            return tableauMelange;
        }

        function chargerQuestion() {
            if (piocheActuelle.length === 0) {
                piocheActuelle = melangerTableau(listeDrapeaux);
            }
            drapeauActuel = piocheActuelle.pop();
            
            document.getElementById("drapeau-a-afficher").textContent = drapeauActuel.drapeau;
            document.getElementById("reponse-utilisateur").value = "";
            document.getElementById("message-feedback").textContent = "";

            // On réaffiche le bouton Valider et on cache le bouton Suivant
            document.getElementById("btn-valider").style.display = "inline-block";
            document.getElementById("btn-suivant").style.display = "none";
            document.getElementById("reponse-utilisateur").disabled = false;
            document.getElementById("reponse-utilisateur").focus();
        }

        function verifierReponse() {
            const saisie = document.getElementById("reponse-utilisateur").value.trim().toLowerCase();
            const bonneReponse = drapeauActuel.nom.trim().toLowerCase();
            const feedback = document.getElementById("message-feedback");

            if (saisie === "") return; // Empêche de valider vide

            if (saisie === bonneReponse) {
                score++;
                document.getElementById("score-actuel").textContent = score;
                feedback.style.color = "green";
                feedback.textContent = "✅ Correct ! Bien joué.";
            } else {
                feedback.style.color = "red";
                feedback.textContent = `❌ Raté ! C'était : ${drapeauActuel.nom}`;
            }

            // On masque le bouton Valider et on affiche le bouton Suivant
            document.getElementById("btn-valider").style.display = "none";
            document.getElementById("btn-suivant").style.display = "inline-block";
            document.getElementById("reponse-utilisateur").disabled = true;
            document.getElementById("btn-suivant").focus();
        }

        // Permettre de valider avec la touche "Entrée"
        document.getElementById("reponse-utilisateur").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verifierReponse();
            }
        });
