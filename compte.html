<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Compte - CultureFaits</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Style du bouton Menu Hamburger fixe */
    .menu-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #2c3e50;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      z-index: 1000;
    }

    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 90%;
      box-sizing: border-box;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      color: #2c3e50;
      font-size: 24px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #4a5568;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      padding-right: 45px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #3182ce;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #718096;
      padding: 0;
      width: auto;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 25px;
    }

    button:not(.menu-btn):not(.toggle-password) {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:not(.menu-btn):not(.toggle-password):active {
      transform: scale(0.99);
    }

    .btn-primary { background-color: #3182ce; color: white; }
    .btn-primary:hover { background-color: #2b6cb0; }
    .btn-secondary { background-color: #38a169; color: white; }
    .btn-secondary:hover { background-color: #2f855a; }
    .btn-danger { background-color: #e53e3e; color: white; }
    .btn-danger:hover { background-color: #c53030; }

    #message {
      margin-top: 20px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    #message.error { display: block; background-color: #fed7d7; color: #9b2c2c; }
    #message.success { display: block; background-color: #c6f6d5; color: #22543d; }

    .hidden { display: none !important; }

    .nav-link {
      margin-top: 25px;
      display: inline-block;
      color: #4a5568;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Bouton pour ouvrir le menu (si tu utilises le même script de menu global) -->
  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="card">
    <div id="auth-section">
      <h2 id="form-title">Mon Compte</h2>
      
      <div class="input-group">
        <label for="pseudo">Pseudo (pour le classement)</label>
        <input type="text" id="pseudo" placeholder="Ton pseudo de joueur" required>
      </div>

      <div class="input-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="votre@email.com" required>
      </div>

      <div class="input-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="6 caractères minimum" required>
          <button type="button" id="toggle-pwd-btn" class="toggle-password" title="Afficher le mot de passe">👁️</button>
        </div>
      </div>

      <div class="button-group">
        <button id="btn-login" class="btn-primary">Se connecter</button>
        <button id="btn-signup" class="btn-secondary">S'inscrire</button>
      </div>
    </div>

    <div id="user-section" class="hidden">
      <h2>Espace Membre</h2>
      <p style="margin-bottom: 10px;">Joueur : <strong id="user-pseudo" style="color: #3182ce;"></strong></p>
      <p style="margin-bottom: 20px; font-size: 14px; color: #718096;">Score total : <span id="user-score" style="font-weight: bold; color: #38a169;">0</span> pts</p>
      
      <div class="button-group">
        <button id="btn-logout" class="btn-danger">Se déconnecter</button>
      </div>
    </div>

    <div id="message"></div>

    <a href="index.html" class="nav-link">← Retour au site principal</a>
  </div>

  <!-- SCRIPT FIREBASE & LOGIQUE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOsryqntdtf2PptednKPDE6BB03jIXH40",
      authDomain: "culturefaits.firebaseapp.com",
      projectId: "culturefaits",
      storageBucket: "culturefaits.firebasestorage.app",
      messagingSenderId: "192511796848",
      appId: "1:192511796848:web:cccef0c7ae77e823d6b6b5",
      measurementId: "G-PNWRYPXC4L"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const pseudoInput = document.getElementById('pseudo');
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');
    const btnSignup = document.getElementById('btn-signup');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const authSection = document.getElementById('auth-section');
    const userSection = document.getElementById('user-section');
    const userPseudoText = document.getElementById('user-pseudo');
    const userScoreText = document.getElementById('user-score');
    const messageDiv = document.getElementById('message');

    togglePwdBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePwdBtn.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        togglePwdBtn.textContent = '👁️';
      }
    });

    function showMessage(text, isError = false) {
      messageDiv.textContent = text;
      messageDiv.className = isError ? 'error' : 'success';
    }

    function clearMessage() {
      messageDiv.textContent = '';
      messageDiv.className = '';
    }

    btnSignup.addEventListener('click', async () => {
      clearMessage();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const pseudo = pseudoInput.value.trim() || "Joueur";

      if (!email || !password) {
        showMessage('Veuillez remplir l\'e-mail et le mot de passe.', true);
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {
          pseudo: pseudo,
          email: email,
          scoreQuiz: 0,
          createdAt: new Date()
        });

        showMessage('Compte et profil créés avec succès !');
      } catch (error) {
        let msg = "Erreur lors de l'inscription.";
        if (error.code === 'auth/email-already-in-use') msg = "Cet e-mail est déjà utilisé.";
        if (error.code === 'auth/weak-password') msg = "Le mot de passe doit faire au moins 6 caractères.";
        showMessage(msg, true);
      }
    });

    btnLogin.addEventListener('click', () => {
      clearMessage();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage('Veuillez remplir tous les champs.', true);
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then(() => showMessage('Connexion réussie !'))
        .catch(() => showMessage('E-mail ou mot de passe incorrect.', true));
    });

    btnLogout.addEventListener('click', () => {
      clearMessage();
      signOut(auth);
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        authSection.classList.add('hidden');
        userSection.classList.remove('hidden');

        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          const data = userDoc.data();
          userPseudoText.textContent = data.pseudo || user.email;
          userScoreText.textContent = data.scoreQuiz || 0;
        } else {
          userPseudoText.textContent = user.email;
        }
      } else {
        authSection.classList.remove('hidden');
        userSection.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
