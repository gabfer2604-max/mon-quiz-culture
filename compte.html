<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion / Inscription - CultureFaits</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #eaeaea;
      max-width: 400px;
      width: 90%;
      box-sizing: border-box;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      color: #000000;
      font-size: 26px;
      font-weight: 700;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #333333;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      padding-right: 45px;
      border: 1px solid #dcdcdc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #ff9500;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #777777;
      padding: 0;
      width: auto;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 25px;
    }

    button:not(.toggle-password) {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:not(.toggle-password):active {
      transform: scale(0.99);
    }

    .btn-primary { background-color: #ff9500; color: #ffffff; }
    .btn-primary:hover { opacity: 0.9; }

    .btn-secondary { background-color: #2ecc71; color: #ffffff; }
    .btn-secondary:hover { opacity: 0.9; }

    #message {
      margin-top: 20px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    #message.error { display: block; background-color: #fde8e8; color: #c53030; }
    #message.success { display: block; background-color: #def7ec; color: #03543f; }

    .nav-link {
      margin-top: 25px;
      display: inline-block;
      color: #666666;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-link:hover { color: #ff9500; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <div id="auth-section">
      <h2>Mon Compte</h2>
      
      <div class="input-group">
        <label for="pseudo">Pseudo (pour le classement)</label>
        <input type="text" id="pseudo" placeholder="Ton pseudo de joueur" required>
      </div>

      <div class="input-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="votre@email.com" required>
      </div>

      <div class="input-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="6 caractères minimum" required>
          <button type="button" id="toggle-pwd-btn" class="toggle-password" title="Afficher le mot de passe">👁️</button>
        </div>
      </div>

      <div class="button-group">
        <button id="btn-login" class="btn-primary">Se connecter</button>
        <button id="btn-signup" class="btn-secondary">S'inscrire</button>
      </div>
    </div>

    <div id="message"></div>

    <a href="index.html" class="nav-link">← Retour à l'accueil</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOsryqntdtf2PptednKPDE6BB03jIXH40",
      authDomain: "culturefaits.firebaseapp.com",
      projectId: "culturefaits",
      storageBucket: "culturefaits.firebasestorage.app",
      messagingSenderId: "192511796848",
      appId: "1:192511796848:web:cccef0c7ae77e823d6b6b5",
      measurementId: "G-PNWRYPXC4L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const pseudoInput = document.getElementById('pseudo');
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');
    const btnSignup = document.getElementById('btn-signup');
    const btnLogin = document.getElementById('btn-login');
    const messageDiv = document.getElementById('message');

    // Voir / Masquer mot de passe
    if (togglePwdBtn && passwordInput) {
      togglePwdBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          togglePwdBtn.textContent = '🙈';
        } else {
          passwordInput.type = 'password';
          togglePwdBtn.textContent = '👁️';
        }
      });
    }

    function showMessage(text, isError = false) {
      if (!messageDiv) return;
      messageDiv.textContent = text;
      messageDiv.className = isError ? 'error' : 'success';
    }

    // Inscription
    if (btnSignup) {
      btnSignup.addEventListener('click', async () => {
        const email = emailInput ? emailInput.value.trim() : '';
        const password = passwordInput ? passwordInput.value : '';
        const pseudo = pseudoInput ? pseudoInput.value.trim() || "Joueur" : "Joueur";

        if (!email || !password) {
          showMessage("Veuillez remplir l'e-mail et le mot de passe.", true);
          return;
        }

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db, "users", userCredential.user.uid), {
            pseudo: pseudo,
            email: email,
            scoreQuiz: 0,
            createdAt: new Date()
          });
          showMessage('Compte créé ! Redirection...');
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        } catch (error) {
          let msg = "Erreur lors de l'inscription.";
          if (error.code === 'auth/email-already-in-use') msg = "Cet e-mail est déjà utilisé.";
          if (error.code === 'auth/weak-password') msg = "Mot de passe de 6 caractères min.";
          showMessage(msg, true);
        }
      });
    }

    // Connexion
    if (btnLogin) {
      btnLogin.addEventListener('click', async () => {
        const email = emailInput ? emailInput.value.trim() : '';
        const password = passwordInput ? passwordInput.value : '';
        const pseudo = pseudoInput ? pseudoInput.value.trim() : '';

        if (!email || !password) {
          showMessage('Veuillez remplir tous les champs.', true);
          return;
        }

        try {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          const userDocRef = doc(db, "users", user.uid);
          await setDoc(userDocRef, {
            email: email,
            ...(pseudo && { pseudo: pseudo })
          }, { merge: true });

          showMessage('Connexion réussie ! Redirection...');
          setTimeout(() => { window.location.href = 'index.html'; }, 1200);

        } catch (error) {
          showMessage('E-mail ou mot de passe incorrect.', true);
        }
      });
    }
  </script>
</body>
</html>
